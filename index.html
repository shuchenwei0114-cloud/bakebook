<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7efe7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BakeBook</title>
  <script id="bakebookVersionGuard">
    (function () {
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (info) {
          if (!info || !info.version) return;
          var url = new URL(window.location.href);
          if (url.searchParams.get("v") === String(info.version)) return;
          url.searchParams.set("v", String(info.version));
          window.location.replace(url.toString());
        })
        .catch(function () {});
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=18" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">我的烘焙食谱</p><h1>BakeBook</h1></div>
      <button class="icon-btn" id="manageCategories" aria-label="管理分类">⚙︎</button>
    </header>

    <section class="search-wrap"><input id="searchInput" type="search" placeholder="搜索食谱名称或食材…" /></section>
    <section class="category-section"><div id="categoryTabs" class="category-tabs" aria-label="食谱分类"></div></section>
    <section class="content-head"><h2 id="sectionTitle">全部食谱</h2><span id="recipeCount" class="muted"></span></section>
    <section id="recipeGrid" class="recipe-list"></section>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-item active" data-action="home"><span>⌂</span><small>首页</small></button>
    <button class="nav-item add" data-action="add"><span>＋</span><small>添加</small></button>
    <button class="nav-item" data-action="search"><span>⌕</span><small>搜索</small></button>
    <button class="nav-item" data-action="settings"><span>⚙︎</span><small>设置</small></button>
  </nav>

  <dialog id="recipeDialog" class="sheet-dialog">
    <article class="sheet-card">
      <div class="sheet-head"><button class="text-btn" id="closeRecipe">关闭</button><span></span><button class="text-btn strong" id="editRecipe">编辑</button></div>
      <p class="eyebrow" id="detailCategory"></p>
      <h2 id="detailName"></h2>
      <div class="meta-row detail-meta" id="detailMeta"></div>
      <h3>配料</h3><ul id="detailIngredients" class="clean-list"></ul>
      <h3>制作步骤</h3><div id="detailSteps" class="detail-steps"></div>
      <section><h3>备注</h3><p id="detailNotes" class="notes-box"></p></section>
    </article>
  </dialog>

  <dialog id="editorDialog" class="sheet-dialog">
    <form id="recipeForm" class="sheet-card form-card">
      <div class="sheet-head"><button type="button" class="text-btn" id="cancelEditor">取消</button><strong id="editorTitle">新增食谱</strong><span></span></div>
      <label>食谱名称<input id="recipeName" required placeholder="例如：糯米吐司" /></label>
      <label>分类<select id="recipeCategory"></select></label>
      <label>是否需要过夜准备
        <select id="recipeOvernight">
          <option value="false">否</option>
          <option value="true">是</option>
        </select>
      </label>
      <label>总用时<div class="readonly-time"><strong id="totalTime">0</strong> 分钟 <span>（根据下面步骤自动计算）</span></div></label>
      <div class="ingredients-head"><strong>配料</strong><button type="button" class="small-add" id="addIngredientButton">＋ 添加食材</button></div>
      <div class="ingredient-columns" aria-hidden="true"><span>食材</span><span>数量</span><span>单位</span><span></span></div>
      <div id="ingredientsEditor" class="ingredients-editor"></div>
      <div class="steps-head"><strong>制作步骤</strong><button type="button" class="small-add" id="addStepButton">＋ 添加一步</button></div>
      <div id="stepsEditor" class="steps-editor"></div>
      <label>备注<textarea id="recipeNotes" rows="4" placeholder="例如：下次牛奶减少 10g…"></textarea></label>
      <p id="saveStatus" class="save-status"></p>
      <button class="primary-btn" id="saveRecipeButton" type="submit">保存</button>
      <button class="danger-btn hidden" type="button" id="deleteRecipe">删除这个食谱</button>
    </form>
  </dialog>

  <dialog id="categoryDialog" class="sheet-dialog">
    <section class="sheet-card form-card">
      <div class="sheet-head"><button class="text-btn" id="closeCategories">关闭</button><strong>管理分类</strong><span></span></div>
      <div id="categoryManager"></div>
      <div class="inline-add"><input id="newCategoryName" placeholder="新增分类名称" /><button id="addCategoryButton">＋ 添加</button></div>
      <p class="save-hint">修改会自动保存。</p>
    </section>
  </dialog>

  <dialog id="settingsDialog" class="sheet-dialog">
    <section class="sheet-card form-card">
      <div class="sheet-head"><button class="text-btn" id="closeSettings">关闭</button><strong>数据连接</strong><span></span></div>
      <div class="connection-card">
        <p class="muted">数据仓库</p>
        <strong>shuchenwei0114-cloud/bakebook</strong>
        <p id="connectionStatus" class="connection-status">尚未连接</p>
      </div>
      <label>GitHub Fine-grained token
        <input id="githubToken" type="password" autocomplete="off" placeholder="粘贴 token" />
      </label>
      <label class="check-row"><input id="rememberToken" type="checkbox" /> <span>记住这台设备</span></label>
      <p class="save-hint">Token 只保存在这台设备的浏览器里，不会写进网页代码或食谱数据。</p>
      <button class="primary-btn" type="button" id="testGithubConnection">测试并保存连接</button>
      <button class="secondary-btn" type="button" id="forgetGithubConnection">清除这台设备上的 token</button>
      <p class="muted" style="margin-top:24px; line-height:1.6;">BakeBook v18<br>上次更新：2026-09-19 19:30</p>
    </section>
  </dialog>

  <dialog id="messageDialog"><div class="dialog-card"><h3 id="dialogTitle">提示</h3><p id="dialogText"></p><button id="closeDialog">知道了</button></div></dialog>

  <script src="app.js?v=18" defer></script>
</body>
</html>
